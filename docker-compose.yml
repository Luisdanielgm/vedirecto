# Local: probar la imagen como en producción (puerto publicado al host).
services:
  vedirecto:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    container_name: vedirecto
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATA_DIR=/app/data
      - CAUCE_API_KEY=${CAUCE_API_KEY:?defini CAUCE_API_KEY}
      - CAUCE_BASE_URL=${CAUCE_BASE_URL:-https://api.cauce.me/v1}
      - CAUCE_MODEL=${CAUCE_MODEL:-deepseek-v4-flash}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
    volumes:
      - vedirecto-data:/app/data

volumes:
  vedirecto-data:
