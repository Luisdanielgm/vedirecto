# Producción en Dokploy: Traefik enruta el dominio → contenedor:3000.
# No se publican puertos al host; el contenedor se une a la red de Dokploy.
services:
  vedirecto:
    build:
      context: .
      # NEXT_PUBLIC_* se hornean en el build → van como args (Dokploy las toma de su Environment).
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    restart: unless-stopped
    # Tope de memoria: si algo se descontrola (scrape a un sitio gigante, ráfaga de
    # altas), muere SOLO este contenedor y NO arrastra a Dokploy/Traefik por un OOM
    # del host (los 4GB son compartidos). El heap de Node queda debajo del límite.
    mem_limit: 768m
    environment:
      - DATA_DIR=/app/data
      - NODE_OPTIONS=--max-old-space-size=512
      # Host canónico para el redirect post-login (evita open redirect). Ej: https://vedirecto.es
      - SITE_URL=${SITE_URL:-}
      # Definí estas en el panel Environment de Dokploy (NUNCA en el repo).
      - CAUCE_API_KEY=${CAUCE_API_KEY:?defini CAUCE_API_KEY en Dokploy}
      - CAUCE_BASE_URL=${CAUCE_BASE_URL:-https://api.cauce.me/v1}
      - CAUCE_MODEL=${CAUCE_MODEL:-deepseek-v4-flash}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - VISIT_SALT=${VISIT_SALT:-vedirecto}
      - CRON_SECRET=${CRON_SECRET:-}
    volumes:
      - vedirecto-data:/app/data
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  vedirecto-data:
